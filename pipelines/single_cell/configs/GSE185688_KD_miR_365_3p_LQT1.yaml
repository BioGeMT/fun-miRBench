# LNA antimiR-365 against LNA antimiR-Ctrl (Exiqon/Qiagen, 25 nM, RNAiMAX, 48 h) in iPSC-derived cardiomyocytes of a
# long-QT type 1 line. Untreated, antimiR-Ctrl and antimiR-365 cells were hashed with TotalSeq-A antibodies, pooled
# 1:2:3 and run in one 10x 3' v3.1 lane (GSM5621621, hashtag calls GSM5621622). HumanHashtag2, 3 and 4 hold 668,
# 1,791 and 5,056 cells, the 1:2:3 order of the GEO record; doublet calls are left out. Paper:
# 10.1038/s41467-021-27856-7. QC: no thresholds stated; at least 500 genes and at most 50% mitochondrial counts
# (cardiomyocytes carry many mitochondria).
dataset_id: GSE185688_KD_miR_365_3p_LQT1
mirna_name: hsa-miR-365a-3p
experiment_type: Knockdown
gse: GSE185688

samples:
  - sample_id: antimir_ctrl
    group: control
    matrix: data/single_cell/raw/GSE185688/GSM5621621_LQT1_matrix.mtx.gz
    features: data/single_cell/raw/GSE185688/GSM5621621_LQT1_features.tsv.gz
    barcodes: data/single_cell/raw/GSE185688/GSM5621621_LQT1_barcodes.tsv.gz
    cell_labels: {path: data/single_cell/raw/GSE185688/GSM5621622_LQT1_HTOtags.csv.gz, barcode_column: cell_barcode,
                  label_column: feature_call, label: HumanHashtag3}
  - sample_id: antimir_365
    group: treated
    matrix: data/single_cell/raw/GSE185688/GSM5621621_LQT1_matrix.mtx.gz
    features: data/single_cell/raw/GSE185688/GSM5621621_LQT1_features.tsv.gz
    barcodes: data/single_cell/raw/GSE185688/GSM5621621_LQT1_barcodes.tsv.gz
    cell_labels: {path: data/single_cell/raw/GSE185688/GSM5621622_LQT1_HTOtags.csv.gz, barcode_column: cell_barcode,
                  label_column: feature_call, label: HumanHashtag4}

qc:
  min_genes: 500
  max_mito_fraction: 0.5

metadata:
  organism: Homo sapiens
  tested_cell_line: iPSC-derived cardiomyocytes, long-QT type 1 line
  treatment: LNA antimiR-365 against LNA antimiR-Ctrl, 25 nM, 48 h
  tissue: Heart
  method: scRNA-seq (10x, cell hashing), pseudobulk per hashed arm
  article_pubmed_id: https://doi.org/10.1038/s41467-021-27856-7
