# The tool versions of the reruns that built the benchmark data; apeglm for label_states.R.
name: funmirbench-processing
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip
  - uv
  - fastqc=0.12.1
  - fastp=1.3.6
  - star=2.7.11b
  - subread=2.1.1
  - r-base=4.5.3
  - bioconductor-deseq2=1.50.2
  - bioconductor-apeglm=1.32.0
