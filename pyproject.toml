[project]
name = "funmirbench"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scipy>=1.11",
    "pyyaml>=6",
    "requests>=2.32",
]

[dependency-groups]
dev = ["scikit-learn>=1.5"]

[project.scripts]
funmirbench = "funmirbench.benchmark:main"
funmirbench-experiments = "funmirbench.experiments_pipeline:main"
funmirbench-download-data = "funmirbench.published_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
