[project]
name = "funmirbench"
version = "0.1.0"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "scipy>=1.11",
    "pyyaml>=6",
    "requests>=2.32",
    "anndata>=0.11",
    "h5py>=3.10",
]

[dependency-groups]
dev = ["scikit-learn>=1.5"]

[project.scripts]
funmirbench = "funmirbench.benchmark:main"
funmirbench-experiments = "funmirbench.experiments_pipeline:main"
funmirbench-add = "funmirbench.add_experiment:main"
funmirbench-single-cell = "funmirbench.single_cell_pipeline:main"
funmirbench-single-cell-final = "funmirbench.single_cell_final:main"
funmirbench-single-cell-combine = "funmirbench.single_cell_final:combine_main"
funmirbench-single-cell-cooccurrence = "funmirbench.single_cell_cooccurrence:main"
funmirbench-single-cell-eval = "funmirbench.single_cell_eval:main"
funmirbench-download-data = "funmirbench.published_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
