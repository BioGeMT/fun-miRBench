# FuNmiRBench benchmark configuration.
#
# All file paths are relative to this YAML file's directory.
# Run: uv run funmirbench --config benchmark.yaml

experiments_tsv: metadata/mirna_experiment_info.tsv
predictions_tsv: metadata/predictions_info.tsv

# Filter experiments by any column in the experiments TSV.
# AND across columns, OR within each column's value list.
# The default repo config ships with a small 2-dataset demo selection.
# Edit or comment these active rows to benchmark other subsets.
experiments:
  id: [GSE169128_KO_miR_3662, GSE124411_OE_miR_150_5p_1]
  # mirna_name: [hsa-miR-375-3p]
  # tested_cell_line: [HUV-EC-C]
  # tissue: [Cervix]
  # method: [RNA-seq]
  # experiment_type: [Overexpression, Knockdown]

# The default repo config compares TargetScan, miRDB, microT-CNN, miRBind2, and miRAW.
predictors:
  tool_id: [targetscan, mirdb_mirtarget, microt_cnn, mirbind2, miraw]

evaluation:
  predictor_load_workers: 2
  fdr_threshold: 0.05
  effect_threshold: 1.0
  predictor_top_fraction: 0.10
  write_top_prediction_cdfs: true
  report_min_common_coverage: 0.10
  # Primary benchmark universe: Ensembl protein-coding genes only.
  # The first run downloads/reuses the Ensembl v115 GTF and caches the gene set.
  protein_coding_only: true
  protein_coding_gtf: data/common_resources/ensembl/Homo_sapiens.GRCh38.115.gtf.gz
  protein_coding_gene_cache: data/common_resources/ensembl/protein_coding_gene_ids.txt
  figure_dpi: 600
  # Ground-truth policies. The defaults keep the legacy binary GT rule and dataset selection.
  # fdr_na_policy: genes with a missing FDR but a reported PValue (e.g. DESeq2
  #   independent filtering). negative = treat as FDR 1.0, so they can be GT negatives;
  #   exclude = leave them out of both GT classes (counted as rows_excluded_fdr_na).
  fdr_na_policy: negative
  # zero_positive_policy: experiments with no GT positives. exclude = skip them during
  #   validation; continuous_only = evaluate them with Spearman/Pearson only (AUROC/APS/
  #   PR-AUC are NA with a class_metrics_na_reason). Spearman is always written to
  #   tables/per_experiment/continuous_metrics_per_experiment.tsv, also for predictors
  #   whose scored genes contain no positives.
  zero_positive_policy: exclude
  # Reference baselines scored from each DE table: seeded random and control expression
  # (control_mean_normalized_count, both directions), on all usable genes. They are
  # written to separate reference tables, never to predictor tables or plots.
  reference_baselines: true
  reference_seed: 0

out_dir: results/
