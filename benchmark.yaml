# FuNmiRBench benchmark configuration.
#
# All file paths are relative to this YAML file's directory.
# Run: uv run funmirbench --config benchmark.yaml

# The final per-gene tables of pipelines/final_data and the MANE Select 3'UTR of each gene.
final_dir: results/final_data
utr_fasta: data/common_resources/ensembl/Homo_sapiens.GRCh38.Ensembl115.MANE_Select_v1.4.3utr.fa
mirnas_tsv: metadata/benchmark_mirnas.tsv
predictions_tsv: metadata/predictions_info.tsv

# Filter experiments by any column of comparisons.tsv in final_dir; only OE experiments are scored.
# AND across columns, OR within each column's value list.
experiments:
  # mirna_name: [hsa-miR-375-3p]
  # cell_line: [HUV-EC-C]

# Add your own predictor to predictions_tsv and to this list.
predictors:
  tool_id: [targetscan_family_expanded, mirdb_mirtarget, microt_cnn, mirbind2, miraw]

evaluation:
  min_per_state: 30  # AUROC only where each state has at least this many genes
  bootstrap: 2000
  seed: 0

out_dir: results/
