# Evaluation of the selected single-cell comparisons. All file paths are relative to this YAML file's directory.
# Run: uv run funmirbench-single-cell-eval --config single_cell_eval.yaml

# The final tables, from pipelines/single_cell/run.sh for all three groups.
final_dir: data/single_cell/final
selected: pipelines/single_cell/selected_comparisons.tsv
# The fixed tables of the evaluation: miRNA profiles, seed checks, control check, experiment labels.
tables_dir: pipelines/single_cell/evaluation
mirnas_tsv: metadata/benchmark_mirnas.tsv
predictions_tsv: metadata/predictions_info.tsv

predictors:
  tool_id: [targetscan_family_expanded, mirdb_mirtarget, microt_cnn, mirbind2, miraw]

evaluation:
  min_per_state: 30
  bootstrap: 2000
  seed: 0

out_dir: results/single_cell
